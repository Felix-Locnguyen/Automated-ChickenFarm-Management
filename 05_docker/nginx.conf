# 05_docker/nginx.conf — config cho container frontend (nginx:alpine)
# - Phát file build Vite tại /usr/share/nginx/html
# - /api/* và /storage/* → backend:8020 (thay vite proxy của môi trường dev)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API backend (REST /api/...)
    location /api/ {
        proxy_pass http://backend:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ảnh camera lưu local (fallback khi MinIO chưa chạy)
    location /storage/ {
        proxy_pass http://backend:8020;
        proxy_set_header Host $host;
    }

    # SPA: mọi đường dẫn khác → index.html (app tự render theo state)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets build (Vite hash tên file → cache cứng an toàn)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
