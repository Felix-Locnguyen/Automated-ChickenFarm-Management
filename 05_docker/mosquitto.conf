# 05_docker/mosquitto.conf — broker MQTT cho container
# Chạy: đã cấu hình trong docker-compose.yml (service mosquitto)

# Lắng nghe mọi interface trong container, port chuẩn 1883
listener 1883

# DEV: cho phép kết nối không cần tài khoản.
# PROD: đổi thành allow_anonymous false + tạo file mật khẩu:
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/password.txt farm
#   (trong file: allow_anonymous false / password_file /mosquitto/config/password.txt)
allow_anonymous true

# Lưu retained message + subscriptions xuống disk (volume mosquitto-data)
# → thiết bị reboot không mất trạng thái
persistence true
persistence_location /mosquitto/data/
